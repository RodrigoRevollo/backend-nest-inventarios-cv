services:
  postgre_nest:
    container_name: postgres_nest
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BD_USERNAME}
      POSTGRES_PASSWORD: ${BD_PASSWORD}
      POSTGRES_DB: ${BD_DATABASE}
    ports:
      - '${BD_PORT}:5432' # Usa la variable del .env para el puerto
    restart: always
    volumes:
      - pg_data_nest:/var/lib/postgresql/data

volumes:
  pg_data_nest: