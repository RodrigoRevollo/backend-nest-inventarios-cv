<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Client Test - NestJS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div id="loginView" class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 transition-all duration-300">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-gray-800">Bienvenido</h2>
            <p class="text-sm text-gray-500 mt-1">Inicia sesión para probar la API de NestJS</p>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">API Base URL</label>
            <input type="text" id="loginBaseUrl" value="http://127.0.0.1:5000" class="w-full p-2.5 border rounded-lg bg-gray-50 font-mono text-xs focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <hr class="border-gray-100 my-4">

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="loginEmail" value="rodrigorevollo@example.com" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="loginPassword" value="L@desiempre3466" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            
            <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Ingresar al Dashboard
            </button>
        </form>
    </div>


    <div id="dashboardView" class="hidden w-full max-w-6xl bg-white rounded-xl shadow-lg p-6 my-4 transition-all duration-300">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Tester de API NestJS</h1>
                <p class="text-sm text-green-600 flex items-center gap-1 mt-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> 
                    Sesión Activa de Rodrigo
                </p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="text-right hidden md:block">
                    <span class="text-xs text-gray-400 block">Endpoint Base</span>
                    <span id="currentUrlLabel" class="text-sm font-mono text-gray-600 bg-gray-100 px-2 py-0.5 rounded"></span>
                </div>
                <button onclick="logout()" class="ml-auto sm:ml-0 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium px-4 py-2 rounded-lg border border-red-200 transition">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-5 space-y-4 max-h-[70vh] overflow-y-auto pr-2">
                
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-xs">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Listar Recursos</h2>
                    <button onclick="getUsers()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 rounded-lg transition shadow-xs">
                        GET /users (Obtener Todos)
                    </button>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-xs">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Buscar por ID</h2>
                    <div class="space-y-2">
                        <input type="text" id="userId" value="26691728-b873-47e6-8cde-1e11dc6ca9d6" placeholder="UUID del Usuario" class="w-full p-2 text-sm border rounded-lg font-mono">
                        <button onclick="getUserById()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium py-2 rounded-lg transition">
                            GET /users/:id
                        </button>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-xs">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Crear Usuario</h2>
                    <div class="space-y-2">
                        <input type="text" id="createName" value="RodrigoRevollo" placeholder="Nombre" class="w-full p-2 text-sm border rounded-lg">
                        <input type="email" id="createEmail" value="rodrigorevollo@example.com" placeholder="Email" class="w-full p-2 text-sm border rounded-lg">
                        <input type="password" id="createPassword" value="L@desiempre3466" placeholder="Contraseña" class="w-full p-2 text-sm border rounded-lg">
                        <button onclick="createUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-lg transition shadow-xs">
                            POST /users
                        </button>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-xs">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Actualizar Usuario (PATCH)</h2>
                    <div class="space-y-2">
                        <input type="text" id="patchId" value="26691728-b873-47e6-8cde-1e11dc6ca9d6" placeholder="UUID del Usuario" class="w-full p-2 text-sm border rounded-lg font-mono">
                        <input type="text" id="patchName" value="Rodrigo Revollo" placeholder="Nuevo Nombre" class="w-full p-2 text-sm border rounded-lg">
                        <input type="email" id="patchEmail" value="rodrigo.revollo@example.com" placeholder="Nuevo Email" class="w-full p-2 text-sm border rounded-lg">
                        <input type="password" id="patchPassword" value="NuevaClave123" placeholder="Nueva Contraseña" class="w-full p-2 text-sm border rounded-lg">
                        <button onclick="updateUser()" class="w-full bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium py-2 rounded-lg transition">
                            PATCH /users/:id
                        </button>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-xs">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">Eliminar Usuario</h2>
                    <div class="space-y-2">
                        <input type="text" id="deleteId" value="1" placeholder="ID o UUID" class="w-full p-2 text-sm border rounded-lg font-mono">
                        <button onclick="deleteUser()" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 rounded-lg transition">
                            DELETE /users/:id
                        </button>
                    </div>
                </div>

            </div>

            <div class="lg:col-span-7 flex flex-col h-[70vh]">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Respuesta del Servidor</h3>
                    <div class="flex items-center gap-2">
                        <span id="statusBadge" class="hidden px-2 py-0.5 text-xs font-bold rounded-md"></span>
                        <button onclick="clearConsole()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-600 px-2.5 py-1 rounded-md transition">
                            Limpiar
                        </button>
                    </div>
                </div>
                <pre id="responseOutput" class="w-full flex-1 p-4 bg-gray-900 text-emerald-400 font-mono text-sm rounded-xl overflow-auto shadow-inner border border-gray-800 whitespace-pre-wrap">Aquí se verán los resultados en JSON de las operaciones CRUD...</pre>
            </div>
        </div>
    </div>

    <script>
        // Estado de la aplicación
        let BASE_URL = "http://127.0.0.1:5000";
        let AUTH_TOKEN = ""; // Por si tu backend requiere Bearer Token en el futuro

        // --- SISTEMA DE NAVEGACIÓN ---
        async function handleLogin(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('hidden');

            BASE_URL = document.getElementById('loginBaseUrl').value.replace(/\/$/, "");
            
            const bodyData = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                // Petición al endpoint exacto que pasaste
                const res = await fetch(`${BASE_URL}/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                const data = await res.json();

                if (res.ok) {
                    // Si te devuelve un token, lo guardamos para futuras peticiones
                    if (data.token || data.accessToken) {
                        AUTH_TOKEN = data.token || data.accessToken;
                    }
                    
                    // Hacer el cambio de vista visual
                    document.body.className = "bg-gray-100 font-sans min-h-screen p-6 flex items-start justify-center";
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('dashboardView').classList.remove('hidden');
                    document.getElementById('currentUrlLabel').innerText = BASE_URL;
                    
                    // Imprimir el primer éxito del login en la consola del dashboard
                    renderResponse(res.status, data);
                } else {
                    errorDiv.innerText = data.message || `Error ${res.status}: No se pudo iniciar sesión.`;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = `Error de red: No se pudo conectar al backend (${err.message})`;
                errorDiv.classList.remove('hidden');
            }
        }

        function logout() {
            AUTH_TOKEN = "";
            document.body.className = "bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4";
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('loginError').classList.add('hidden');
            clearConsole();
        }

        // --- MANIPULACIÓN DE LA CONSOLA RESPUESTA ---
        function renderResponse(status, data) {
            const badge = document.getElementById('statusBadge');
            badge.classList.remove('hidden');
            badge.innerText = `STATUS: ${status}`;
            
            if (status >= 200 && status < 300) {
                badge.className = "px-2.5 py-0.5 text-xs font-bold rounded-md bg-green-100 text-green-800 border border-green-200";
            } else {
                badge.className = "px-2.5 py-0.5 text-xs font-bold rounded-md bg-red-100 text-red-800 border border-red-200";
            }

            document.getElementById('responseOutput').textContent = JSON.stringify(data, null, 2);
        }

        function clearConsole() {
            document.getElementById('responseOutput').textContent = "Consola limpia.";
            document.getElementById('statusBadge').classList.add('hidden');
        }

        // Helper para agregar headers dinámicos (Incluye Bearer token por si acaso)
        function getHeaders(contentType = true) {
            const headers = { 'Accept': 'application/json' };
            if (contentType) headers['Content-Type'] = 'application/json';
            if (AUTH_TOKEN) headers['Authorization'] = `Bearer ${AUTH_TOKEN}`;
            return headers;
        }

        // --- ENDPOINTS CRUD DE USUARIOS ---

        // 1. GET ALL USERS
        async function getUsers() {
            try {
                const res = await fetch(`${BASE_URL}/users`, {
                    method: 'GET',
                    headers: getHeaders(false)
                });
                const data = await res.json();
                renderResponse(res.status, data);
            } catch (err) {
                renderResponse(500, { error: err.message });
            }
        }

        // 2. GET USER BY ID
        async function getUserById() {
            const id = document.getElementById('userId').value;
            try {
                const res = await fetch(`${BASE_URL}/users/${id}`, {
                    method: 'GET',
                    headers: getHeaders(false)
                });
                const data = await res.json();
                renderResponse(res.status, data);
            } catch (err) {
                renderResponse(500, { error: err.message });
            }
        }

        // 3. CREATE USER (POST)
        async function createUser() {
            const bodyData = {
                name: document.getElementById('createName').value,
                email: document.getElementById('createEmail').value,
                password: document.getElementById('createPassword').value
            };
            try {
                const res = await fetch(`${BASE_URL}/users`, {
                    method: 'POST',
                    headers: getHeaders(true),
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                renderResponse(res.status, data);
            } catch (err) {
                renderResponse(500, { error: err.message });
            }
        }

        // 4. UPDATE USER (PATCH)
        async function updateUser() {
            const id = document.getElementById('patchId').value;
            const bodyData = {
                name: document.getElementById('patchName').value,
                email: document.getElementById('patchEmail').value,
                password: document.getElementById('patchPassword').value
            };
            try {
                const res = await fetch(`${BASE_URL}/users/${id}`, {
                    method: 'PATCH',
                    headers: getHeaders(true),
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                renderResponse(res.status, data);
            } catch (err) {
                renderResponse(500, { error: err.message });
            }
        }

        // 5. DELETE USER
        async function deleteUser() {
            const id = document.getElementById('deleteId').value;
            try {
                const res = await fetch(`${BASE_URL}/users/${id}`, {
                    method: 'DELETE',
                    headers: getHeaders(false)
                });
                let data;
                try { data = await res.json(); } catch { data = { message: `Petición DELETE enviada con éxito (Código ${res.status})` }; }
                renderResponse(res.status, data);
            } catch (err) {
                renderResponse(500, { error: err.message });
            }
        }
    </script>
</body>
</html>
